name: Odesa Alert Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "* * * * *"

permissions:
  contents: write

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check alerts
        run: |
          python scripts/monitor.py

      - name: Save status
        run: |

          git config user.name "Odesa Alert Bot"
          git config user.email "actions@github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Odesa alert status"
            git push
          fi
